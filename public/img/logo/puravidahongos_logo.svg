<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgOlive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555C39"/>
      <stop offset="100%" stop-color="#474E2E"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Olive -->
  <rect width="500" height="500" rx="32" fill="url(#bgOlive)"/>

  <!-- Subtle organic decorative frame -->
  <rect x="24" y="24" width="452" height="452" rx="20" fill="none" stroke="#D7DEC8" stroke-width="1.2" stroke-opacity="0.35" stroke-dasharray="6 4"/>

  <!-- Botanical Spore / Mycelium subtle accent -->
  <g opacity="0.25" stroke="#EDE8DB" fill="none" stroke-width="1.5">
    <circle cx="250" cy="95" r="14"/>
    <circle cx="250" cy="95" r="6"/>
    <path d="M236 95h-12 M264 95h12 M250 81v-12 M250 109v12"/>
  </g>

  <!-- Central Typography "HONGOS PURA VIDA" in Editorial Serif -->
  <g fill="#F5F2EA" text-anchor="middle" font-family="'Cormorant Garamond', 'Playfair Display', 'Bodoni MT', Didot, 'Times New Roman', serif">
    <!-- HONGOS -->
    <text x="250" y="225" font-size="62" font-weight="500" letter-spacing="0.14em" style="text-shadow: 0 2px 8px rgba(0,0,0,0.18);">HONGOS</text>
    
    <!-- PURA VIDA -->
    <text x="250" y="305" font-size="58" font-weight="400" letter-spacing="0.18em" style="text-shadow: 0 2px 8px rgba(0,0,0,0.18);">PURA VIDA</text>
  </g>

  <!-- Subtitle / Apothecary Stamp -->
  <g fill="#D5DEC4" text-anchor="middle" font-family="'Outfit', 'Plus Jakarta Sans', sans-serif">
    <text x="250" y="365" font-size="13" font-weight="600" letter-spacing="0.38em" fill-opacity="0.85">MEDICINA ANCESTRAL</text>
    
    <circle cx="150" cy="361" r="2" fill="#D5DEC4" fill-opacity="0.7"/>
    <circle cx="350" cy="361" r="2" fill="#D5DEC4" fill-opacity="0.7"/>
  </g>

  <!-- Bottom organic curve -->
  <path d="M200 410 C230 422, 270 422, 300 410" fill="none" stroke="#D7DEC8" stroke-width="1.5" stroke-opacity="0.4" stroke-linecap="round"/>
</svg>