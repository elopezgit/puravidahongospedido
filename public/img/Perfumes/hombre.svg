  <rect width="600" height="600" fill="url(#bg)"/>
  <circle cx="300" cy="300" r="210" fill="none" stroke="#C9A962" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="300" cy="300" r="175" fill="none" stroke="#C9A962" stroke-opacity="0.15" stroke-width="1.5"/>
  <!-- Bottle shape -->
