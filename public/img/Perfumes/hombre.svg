  <text x="300" y="288" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" letter-spacing="6" fill="#C9A962">PERFUMERÍA</text>
  <text x="300" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" letter-spacing="4" fill="#C9A962" opacity="0.8">HOMBRE</text>
